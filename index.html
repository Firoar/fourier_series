<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/color-pencil.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Drawing Machine</title>

    <link rel="stylesheet" href="./src/style.css" />
  </head>
  <body>
    <div id="root">
      <div class="mobile-notice">
        🖥️ This website is built for <strong>desktop only</strong>. Please open on a computer for the best experience.
      </div>
      <h1 class="app-title">Drawing Machine</h1>
      <div class="upload-area" id="upload-area">
        <input type="file" id="svg-input" accept=".svg" class="file-input" />
        <span class="upload-label">📂 Drop an SVG here or click to upload</span>
      </div>
      <div class="presets" id="presets">
        <span class="presets-label">or try a preset:</span>
        <button class="btn-bro btn-preset" data-file="old-lady.json">
          👵 Old Lady
        </button>
        <button class="btn-bro btn-preset" data-file="rabbit.json">
          🐰 Rabbit
        </button>
        <button class="btn-bro btn-preset" data-file="mouse.json">
          🐭 Mouse
        </button>
      </div>
      <div class="loading hidden" id="loading">
        <div class="spinner"></div>
        <span class="loading-text">Processing vectors…</span>
      </div>
      <canvas class="hidden" id="canvas"></canvas>
      <div class="draw-controls hidden" id="draw-controls">
        <div class="progress-wrap">
          <div class="progress-bar" id="progress-bar"></div>
          <span class="progress-label" id="progress-label">0%</span>
        </div>
        <div class="speed-control">
          <label class="speed-label" for="speed-slider">🐢 Speed</label>
          <input type="range" id="speed-slider" min="0" max="4" value="0" step="1" class="speed-slider" />
          <span class="speed-value" id="speed-value">1×</span>
        </div>
      </div>
      <div class="controls hidden" id="controls">
        <button class="btn-bro btn-1" id="btn-new">➕ New Image</button>
        <button class="btn-bro btn-2" id="btn-download">⬇️ Download</button>
      </div>
      <!-- <div class="slideshow-container">
        <span class="arrow-div left-arrow" role="button" tabindex="0">
          <img src="./left.png" alt="left" />
        </span>
        <span class="arrow-div right-arrow" role="button" tabindex="0"
          ><img src="./right.png" alt="right"
        /></span>
      </div> -->
    </div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
